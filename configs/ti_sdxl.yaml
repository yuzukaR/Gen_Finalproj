# Textual Inversion on SDXL base 1.0
base_model: stabilityai/stable-diffusion-xl-base-1.0
resolution: 1024
mixed_precision: bf16   # bf16 avoids the fp16 grad-scaler unscale bug + NaN loss on SDXL TI

# Token learned by TI
placeholder_token: "<my-character>"
initializer_token: "cat"        # change to subject's coarse class word
num_vectors: 1                  # multi-vector TI: bump to 2–4 if 1 underfits

# Optimization
learning_rate: 5.0e-4
scale_lr: false
lr_scheduler: constant
lr_warmup_steps: 0
max_train_steps: 3000
train_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.0
adam_epsilon: 1.0e-8

# Logging / saving
save_steps: 500
checkpointing_steps: 1000
seed: 1234
